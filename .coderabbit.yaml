# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
tone_instructions: >-
  Most contributors are volunteers. Be direct and friendly, explain why a change
  matters, and point to the existing code to follow. Use plain American English.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # The summary stays in the walkthrough comment. Writing it into the description
  # reruns the label workflow, which takes off any of its labels added by hand.
  high_level_summary_in_walkthrough: true
  in_progress_fortune: false
  # label-pr.yml owns the labels.
  suggested_labels: false
  auto_review:
    base_branches:
      - ".*"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!**/package-lock.json"
  path_instructions:
    - path: "**/*.bs"
      instructions: |
        Moonfin for Roku is a BrighterScript SceneGraph channel, forked from jellyfin/jellyfin-roku.
        - Inside a namespace, a bare identifier resolves to a namespace function or const before a local or parameter, ignoring case. A local named after a member of its namespace (`name` next to `Name()`, or `version` next to `VERSION`) compiles clean and fails at runtime. Flag those. Never name a local `parsedUrl` in a scope that calls ParsedUrl().
        - Task threads have their own GetGlobalAA, so requests from a task send DeviceId "Roku". From a task, never find our own server session by device id. Match NowPlayingItem.Id plus Client instead.
        - roFileSystem, roUrlTransfer and other MAIN|TASK only objects can't be created on the render thread. Create them in a task's init or run function, never in an observer the render thread fires.
        - Never set clippingRect to [0, 0, 0, 0] to turn clipping off, because it hides every child on device. Use a large rect like BUTTON_NO_CLIP in source/utils/buttonLayout.bs.
        - chainLookup, chainLookupReturn and isChainValid can't index arrays. "MediaSources[0].Size" silently returns the default. Index the array in code after checking it isn't empty.
        - themeApply.ApplyToItem replaces label fonts. Read a hidden label's `.font` after ApplyToItem, or labels built at runtime skip the theme font.
        - Before removeChild on a focused overlay or dialog, call setFocus on the host or on the next target, or the firmware hands focus to an arbitrary node.
        - A node held in a selectedItem field refires when that node changes later. Set selectedItem back to invalid right after setting it, the way ExtrasRowList does.
        - A screen that focuses itself has to clear `m.top.lastFocus` before closing, or it stays alive after popScene.
        - RowList item components that start a repeating animation or timer need a content field that the row owner sets before removing or replacing the row, because pooled items keep running.
        - Once a Label has a width or height, boundingRect() returns that size. Measure the text before sizing it.
        - A Roku seek lands on the keyframe before the target. Logic that seeks past a range and checks the position again has to remember it already skipped.
        - Video nodes can't be masked, rounded, faded or cropped to fill. Don't suggest those.
        - FormatJson sends unquoted AA literal keys in lowercase on the device. Quote every key in a literal whose JSON goes to a case sensitive API outside the Jellyfin server, and add a source check to test/server-compatibility.mjs, since the brs test runner keeps the case.
        - A shared un-namespaced file that calls host component functions goes in components/, not source/. Files under source/ are also checked in the source scope, where those functions don't exist.
        - Live TV logic keys on item Type TvChannel, not ChannelId. A TvChannel item has no ChannelId.
        - Image requests to the server send `"quality": "90"`. Left out, the server encodes at quality 100.
        - Say Seerr, not Jellyseerr. The `jellyseerr_*` registry and `jellyseerr.*` setting names in source/utils/SeerrUtils.bs are a deliberate migration and stay.
    - path: "images/**"
      instructions: |
        The Roku store refuses a package over 4 MiB, and the channel is close to that. Flag new or larger images and ask for the size change. PNGs should go through oxipng. MaskGroup masks (maskUri) have to be palette, gray plus alpha, or RGBA PNGs. The device ignores grayscale or RGB masks, and test/server-compatibility.mjs fails on them. Keep the runner_*_left.png sheets, because a negative scale doesn't mirror on Roku.
    - path: "locale/**"
      instructions: |
        Translations come from Weblate, which pushes straight to master. Ask the author about hand edits to any locale other than en_US.

chat:
  art: false
