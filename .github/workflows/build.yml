name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test server compatibility
        run: npm test

      - name: Build the Moonfin channel
        run: npm run build

      - name: Save build output as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Moonfin-Roku-dev-${{ github.sha }}
          path: ${{ github.workspace }}/build/staging

  # What the PR Comment workflow reads. Without always() a failed build skips this,
  # no artifact is uploaded, and the comment has nothing to read, so the run that
  # most needs a comment is the one that never gets one.
  save-pr-results:
    if: always() && github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Write outcomes.json
        run: |
          cat > outcomes.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }},
            "sha": "${{ github.event.pull_request.head.sha }}",
            "build": "${{ needs.test.result }}"
          }
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: build-results
          path: outcomes.json
