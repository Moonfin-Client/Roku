# Posts one build-status comment on a pull request and rewrites it in place on every
# new commit. It runs on workflow_run rather than pull_request so it still has write
# access on pull requests from forks. It never checks out the branch, it only reads
# the results artifact the build uploaded.

name: PR Comment

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: Download build results
        id: results
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: build-results
          path: build-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post PR comment
        if: steps.results.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const outcomes = JSON.parse(fs.readFileSync('build-results/outcomes.json', 'utf8'));
            const prNumber = outcomes.pr_number;
            const build = outcomes.build;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.payload.workflow_run.id}`;

            const marker = '<!-- moonfin-build-result -->';
            const lines = [marker];

            if (build === 'success') {
              lines.push(
                '## Build Successful',
                '',
                'The channel compiled and packaged. The sideload zip is on the run below.',
              );
            } else {
              lines.push(
                '## Build Failed',
                '',
                'The channel did not compile. bsc reports type and lint problems in the run log.',
              );
            }

            lines.push(
              '',
              '| Property | Value |',
              '|---|---|',
              `| **Build** | ${build === 'success' ? 'Passed' : 'Failed'} |`,
              `| **Commit** | \`${outcomes.sha.substring(0, 7)}\` |`,
              `| **Workflow run** | [Build #${context.payload.workflow_run.run_number}](${runUrl}) |`,
            );

            const body = lines.join('\n');

            // Paginated because the marker falls off the first page once a pull request
            // collects more than 30 comments, which would post a second comment instead
            // of updating the first.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: prNumber, body});
            }
