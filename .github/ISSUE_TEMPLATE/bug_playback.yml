name: "Bug: Playback"
description: Report a video/audio playback issue
title: "[Playback] "
labels: ["Bug", "Playback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out as much as you can, playback issues are very environment + media dependent.

  - type: input
    id: app_version
    attributes:
      label: Moonfin version
      description: The app version / release tag (e.g., 1.0.0)
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: roku_model
    attributes:
      label: Roku device model
      description: "Example: Roku Ultra 4802, TCL 55S535, Hisense R6 Series"
      placeholder: e.g. Roku Ultra 4802
    validations:
      required: true

  - type: input
    id: roku_version
    attributes:
      label: Roku OS version
      description: "Found in Settings > System > About (e.g., 12.5.0)"
      placeholder: e.g. 12.5.0
    validations:
      required: true

  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin server version
      placeholder: 10.x.x
    validations:
      required: true

  - type: dropdown
    id: item_type
    attributes:
      label: Content type
      options:
        - Movie
        - Episode
        - Live TV
        - Music
        - Audiobook
        - Other
    validations:
      required: true

  - type: textarea
    id: media_info
    attributes:
      label: Media details (as much as you know, check the info button at the bottom right of the player)
      description: Container, resolution, HDR type, video codec/profile, audio codec/channels, subtitle type, bitrate
      placeholder: |
        Container: MKV
        Resolution: 3840x2160
        HDR: HDR10
        Video: HEVC Main10@L5.1
        Audio: EAC3 5.1
        Subs: SRT (enabled)
        Bitrate: ~25 Mbps
    validations:
      required: true

  - type: dropdown
    id: playback_path
    attributes:
      label: Playback path
      options:
        - Direct Play
        - Transcode
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: Symptoms (check all that apply)
      options:
        - label: Black screen / endless spinner
        - label: Audio only (no video)
        - label: Stuttering / frame drops
        - label: A/V sync issues
        - label: Seeking/scrubbing broken
        - label: Subtitles missing or incorrect
        - label: Unexpected forced transcode
        - label: App crashes / exits

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Press Play ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Photo or video of the problem
      description: |
        Point your phone at the TV, take a photo of exactly what you're seeing, and drag it into this box. Roku has no diagnostic logging, in the app or on the device, so there's no log file to go looking for and a picture is the only evidence there is.
        If the problem is motion, stuttering, tearing, or A/V sync, a short video is far more useful than a still.
        Please also type out any on-screen error text exactly as it appears, since text in a photo isn't searchable.
    validations:
      required: true
