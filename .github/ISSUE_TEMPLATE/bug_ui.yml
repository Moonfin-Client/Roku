name: "Bug: UI"
description: Report a UI/UX issue (navigation, screens, layout, focus, etc.)
title: "[UI] "
labels: ["Bug", "UI"]
body:
  - type: input
    id: app_version
    attributes:
      label: Moonfin version
      description: The app version / release tag (e.g., 1.0.0)
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: roku_model
    attributes:
      label: Roku device model
      description: "Example: Roku Ultra 4802, TCL 55S535, Hisense R6 Series"
      placeholder: e.g. Roku Ultra 4802
    validations:
      required: true

  - type: input
    id: roku_version
    attributes:
      label: Roku OS version
      description: "Found in Settings > System > About (e.g., 12.5.0)"
      placeholder: e.g. 12.5.0
    validations:
      required: true

  - type: dropdown
    id: screen
    attributes:
      label: Where does it happen?
      options:
        - Login
        - Home
        - Details page
        - Settings
        - Search
        - Library
        - Player UI (controls/OSD)
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Photo or video of the problem
      description: |
        Point your phone at the TV, take a photo of exactly what you're seeing, and drag it into this box. Roku has no diagnostic logging, so a picture is the only evidence there is, and a description on its own is very hard to act on.
        If the problem is motion (a jump, a flicker, or focus landing in the wrong place), a short video is far more useful than a still.
        If you genuinely can't capture one, say why here instead.
    validations:
      required: true
